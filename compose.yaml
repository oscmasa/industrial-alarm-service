services:
  api:
    build:
      context: .
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      ALARM_APP_NAME: ${ALARM_APP_NAME:-Industrial Alarm Service}
      ALARM_DOCS_ENABLED: ${ALARM_DOCS_ENABLED:-true}
      ALARM_DATABASE_URL: ${ALARM_DATABASE_URL:-postgresql+psycopg://alarm_user:local_dev_password@db:5432/alarms}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/status', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/index.html"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alarms}
      POSTGRES_USER: ${POSTGRES_USER:-alarm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
